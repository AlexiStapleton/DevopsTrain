services:
  api:
    build: ./API
    ports: [ "${API_PORT:-8080}:8080" ]
    env_file: .env
    depends_on: 
      db:
        condition: service_healthy
  db:
    image: postgres:16
    container_name: devops-train
    restart: unless-stopped
    env_file: .env
    ports: [ "127.0.0.1:${DB_HOST_PORT:-5433}:5432" ]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: